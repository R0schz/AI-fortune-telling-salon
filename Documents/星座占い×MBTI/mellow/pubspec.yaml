name: mellow
description: "16タイプ × 四元素占い — 内省サポートアプリ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP client
  dio: ^5.8.0+1

  # Local storage
  shared_preferences: ^2.3.3

  # Subscription
  purchases_flutter: ^10.0.0

  # Local notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # URL launcher (16Personalities リンクなど)
  url_launcher: ^6.3.1

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
