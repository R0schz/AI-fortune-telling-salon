# Fly.io デプロイ設定
# アプリ名は fly launch 実行時に自動設定されます

app = "mellow-api"
primary_region = "nrt"  # 東京リージョン

[build]

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/mellow.db"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # 常時起動（Cron のため）
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "mellow_data"
  destination = "/data"
